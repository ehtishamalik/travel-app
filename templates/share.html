{% extends "index.html" %} {% block title %}Share | Travel Tales{% endblock %}
{% block content %}

<header class="pad has-nav">
  <div class="container">
    <h1>Share Destination</h1>
    <p class="text-gray">Share your experience with others.</p>
  </div>
</header>
<section class="share">
  <div class="container">
    <div class="form-wrapper">
      <form
        action="{{ url_for('views.share') }}"
        class="form"
        method="post"
        enctype="multipart/form-data"
      >
        <div class="form-group">
          <label for="desname">Destination Name</label>
          <input
            type="text"
            maxlength="30"
            name="desname"
            id="desname"
            placeholder="🙌"
            required
          />
        </div>
        <div class="form-group pos-relative">
          <label for="message">Description</label>
          <textarea
            name="description"
            id="message"
            cols="30"
            rows="10"
            maxlength="400"
            placeholder="🙌"
            required
          ></textarea>
          <p id="char-count">0 / 400</p>
        </div>
        <div class="form-group">
          <label for="desname">URL to Visit</label>
          <input
            type="text"
            name="link"
            id="url_link"
            placeholder="🙌"
            required
          />
        </div>
        <div class="form-group has-input-image">
          <label for="image-input" class="image-input-label"
            >Choose a file</label
          >
          <input
            id="image-input"
            type="file"
            accept=".png,.jpg,.jpeg"
            name="image"
            required
          />
        </div>
        <button id="submit-btn" type="submit" class="button is-style-primary">
          Submit
        </button>
      </form>
    </div>
  </div>
</section>

{% endblock %}
